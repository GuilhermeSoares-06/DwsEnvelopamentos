<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Retorno do Pagamento - DWS</title>
<style>
    body { font-family: Arial, sans-serif; background:#0f0f0f; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background:#1c1c1c; padding:32px 40px; border-radius:12px; text-align:center; max-width:420px; }
    .icone { font-size:48px; margin-bottom:12px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#bbb; font-size:14px; }
    a.btn { display:inline-block; margin-top:20px; padding:10px 20px; background:#25d366; color:#000; text-decoration:none; border-radius:8px; font-weight:bold; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="icone" id="icone">⏳</div>
        <h1 id="titulo">Verificando pagamento...</h1>
        <p id="descricao">Aguarde um instante enquanto confirmamos com o Mercado Pago.</p>
        <a class="btn" href="/telas/Cliente/principalFUN.html">Voltar ao início</a>
    </div>

    <script src="../../js/pagamento.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const statusUrl = params.get('status'); // success | failure | pending (vem da URL de retorno do MP)
        const servicoId = params.get('servico_id') || sessionStorage.getItem('ultimo_servico_id');

        const textos = {
            success: { icone: '✅', titulo: 'Pagamento aprovado!', desc: 'Seu agendamento foi confirmado. Em breve entraremos em contato.' },
            failure: { icone: '❌', titulo: 'Pagamento não aprovado', desc: 'Tente novamente ou escolha outra forma de pagamento.' },
            pending: { icone: '⏳', titulo: 'Pagamento em análise', desc: 'Assim que for aprovado, seu agendamento será confirmado automaticamente.' }
        };

        function aplicarTexto(chave) {
            const t = textos[chave] || textos.pending;
            document.getElementById('icone').textContent = t.icone;
            document.getElementById('titulo').textContent = t.titulo;
            document.getElementById('descricao').textContent = t.desc;
        }

        aplicarTexto(statusUrl);

        // Confirma com o backend o status real (o webhook pode levar alguns segundos)
        if (servicoId) {
            verificarStatusPagamento(servicoId).then(status => {
                if (status === 'aprovado') {
                    aplicarTexto('success');
                    // Só agora, com o pagamento confirmado, abre o WhatsApp para avisar
                    const whatsappUrl = sessionStorage.getItem('ultimo_whatsapp_url');
                    if (whatsappUrl) {
                        setTimeout(() => window.open(whatsappUrl, '_blank'), 1500);
                    }
                } else if (status === 'rejeitado' || status === 'cancelado') {
                    aplicarTexto('failure');
                }
            });
        }
    </script>
</body>
</html>
