<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Editar Perfil - DWS Envelopamento</title>
<link rel="icon" type="image/png" href="../../img/logoabas.png">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050505;
        background-image:
            radial-gradient(ellipse at top left, rgba(242, 53, 53, 0.10) 0%, transparent 50%),
            radial-gradient(ellipse at bottom right, rgba(242, 53, 53, 0.06) 0%, transparent 50%);
        background-attachment: fixed;
        margin: 0;
        padding: 20px;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
    }

    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(242, 53, 53, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(242, 53, 53, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
        animation: gridMove 25s linear infinite;
    }
    @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 60px 60px; }
    }

    .box {
        width: 500px;
        max-width: 100%;
        background: linear-gradient(145deg, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.98));
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 45px 40px 35px;
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .box::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 30px;
        padding: 2px;
        background: linear-gradient(
            var(--angle, 0deg),
            transparent,
            #f23535,
            #ff6b6b,
            #f23535,
            transparent
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: ledRotate 4s linear infinite;
        pointer-events: none;
    }

    @keyframes ledRotate {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .box-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #f23535, #c91f2c);
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 2.2rem;
        color: #fff;
        box-shadow: 0 20px 50px rgba(242,53,53,0.4);
        transform: rotate(-5deg);
        animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(-5deg) translateY(-8px); }
    }

    .box h2 {
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.4rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
    }

    .box .subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 25px;
    }

    .loading-info {
        text-align: center;
        color: #888;
        padding: 30px 0;
    }
    .loading-info i {
        color: #f23535;
        font-size: 2rem;
        margin-bottom: 12px;
    }

    .input-box {
        position: relative;
        margin-bottom: 16px;
        width: 100%;
    }
    .input-box .input-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 1rem;
        transition: 0.3s;
        z-index: 1;
        pointer-events: none;
    }
    .input-box input {
        width: 100%;
        padding: 16px 18px 16px 50px;
        border: 2px solid rgba(255,255,255,0.08);
        outline: none;
        font-size: 0.95rem;
        border-radius: 14px;
        background: rgba(255,255,255,0.02);
        color: #fff;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-family: inherit;
    }
    .input-box input::placeholder { color: #555; font-weight: 400; }
    .input-box input:focus {
        border-color: #f23535;
        background: rgba(242,53,53,0.03);
        box-shadow: 0 0 0 4px rgba(242, 53, 53, 0.1);
    }
    .input-box input:focus ~ .input-icon { color: #f23535; }
    .input-box input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-salvar {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #f23535, #c91f2c);
        color: white;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(242,53,53,0.3);
    }
    .btn-salvar::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        transition: left 0.6s ease;
    }
    .btn-salvar:hover::before { left: 100%; }
    .btn-salvar:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 25px 55px rgba(242,53,53,0.5);
    }
    .btn-salvar:disabled {
        opacity: 0.7;
        cursor: wait;
        transform: none;
    }

    .btn-voltar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
        padding: 12px 24px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        color: #aaa;
        text-decoration: none;
        border-radius: 12px;
        font-size: 0.85rem;
        transition: 0.3s;
    }
    .btn-voltar:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
        transform: translateX(-3px);
    }

    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 16px 24px;
        border-radius: 14px;
        color: #fff;
        font-weight: 500;
        font-size: 0.9rem;
        display: none;
        align-items: center;
        gap: 10px;
        z-index: 9999;
        box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        max-width: 400px;
        animation: toastIn 0.3s ease;
    }
    .toast.show { display: flex; }
    .toast.success {
        background: linear-gradient(135deg, #4CAF50, #388E3C);
        border-left: 4px solid #66BB6A;
    }
    .toast.error {
        background: linear-gradient(135deg, #f23535, #c91f2c);
        border-left: 4px solid #ff5555;
    }
    @keyframes toastIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
        html, body { padding: 12px; }
        .box { padding: 35px 22px 25px; border-radius: 24px; }
        .box-icon { width: 65px; height: 65px; font-size: 1.8rem; margin-bottom: 15px; }
        .box h2 { font-size: 1.2rem; }
        .box .subtitle { font-size: 0.8rem; margin-bottom: 20px; }
        .input-box input { padding: 14px 14px 14px 44px; font-size: 0.9rem; }
        .input-box .input-icon { left: 15px; font-size: 0.9rem; }
        .btn-salvar { font-size: 0.8rem; padding: 14px; }
        .toast { left: 12px; right: 12px; bottom: 12px; }
    }
</style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="box">
        <div class="box-icon">
            <i class="fas fa-user-edit"></i>
        </div>

        <h2>Editar Perfil</h2>
        <p class="subtitle">Atualize seus dados</p>

        <div id="loadingInfo" class="loading-info">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Carregando dados...</p>
        </div>

        <form id="formEditarPerfil" style="display: none;">
            <input type="hidden" id="editId">

            <div class="input-box">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="editNome" placeholder="NOME COMPLETO" required maxlength="100">
            </div>

            <div class="input-box">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="editEmail" placeholder="E-MAIL (opcional)" maxlength="150">
            </div>

            <div class="input-box">
                <i class="fas fa-id-card input-icon"></i>
                <input type="text" id="editCpf" placeholder="CPF" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-phone input-icon"></i>
                <input type="text" id="editTelefone" placeholder="TELEFONE (14) 99999-9999" maxlength="15">
            </div>

            <div class="input-box">
                <i class="fas fa-home input-icon"></i>
                <input type="text" id="editEndereco" placeholder="ENDEREÇO" maxlength="150">
            </div>

            <div class="input-box">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="editSenha" placeholder="NOVA SENHA (deixe em branco para manter)" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-salvar" id="btnSalvar">
                <i class="fas fa-check"></i> SALVAR ALTERAÇÕES
            </button>
        </form>

        <a href="principal.html" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">Mensagem</span>
    </div>

    <script>
        // =============================================
        // TOAST
        // =============================================
        function showToast(msg, tipo = 'success') {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toastText');
            text.textContent = msg;
            toast.className = 'toast show ' + tipo;

            const icon = toast.querySelector('i');
            icon.className = tipo === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // =============================================
        // CARREGA DADOS DO CLIENTE
        // =============================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Verifica sessão
                const resSessao = await fetch('../../PHP/Clientes/sessao_cliente.php', {
                    credentials: 'include',
                    cache: 'no-store'
                });
                const dataSessao = await resSessao.json();

                if (!dataSessao.logado) {
                    showToast('Você precisa estar logado!', 'error');
                    setTimeout(() => window.location.href = 'loginClientes.html', 1200);
                    return;
                }

                // 2. Busca perfil completo
                const resPerfil = await fetch('../../PHP/Clientes/buscar_perfil.php', {
                    credentials: 'include',
                    cache: 'no-store'
                });
                const dados = await resPerfil.json();

                console.log('📋 Perfil carregado:', dados);

                if (dados.status === 'sucesso' && dados.cliente) {
                    const c = dados.cliente;

                    // Preenche os campos
                    document.getElementById('editId').value = c.cliid || '';
                    document.getElementById('editNome').value = c.clinome || '';
                    document.getElementById('editEmail').value = c.cliemail || '';
                    document.getElementById('editCpf').value = c.clicpf || '';
                    document.getElementById('editTelefone').value = c.clitel || '';
                    document.getElementById('editEndereco').value = c.cliendereco || '';

                    // 🔥 Mostra o formulário SEMPRE (mesmo se vier sem email)
                    document.getElementById('loadingInfo').style.display = 'none';
                    document.getElementById('formEditarPerfil').style.display = 'block';
                } else {
                    showToast(dados.mensagem || 'Erro ao carregar dados.', 'error');
                    document.getElementById('loadingInfo').innerHTML = `
                        <i class="fas fa-exclamation-triangle" style="color:#f23535;"></i>
                        <p>${dados.mensagem || 'Erro ao carregar dados.'}</p>
                        <a href="loginClientes.html" class="btn-voltar" style="margin-top:15px;">Fazer login</a>
                    `;
                }
            } catch (e) {
                console.error('❌ Erro:', e);
                showToast('Erro de conexão.', 'error');
                document.getElementById('loadingInfo').innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color:#f23535;"></i>
                    <p>Erro de conexão. Recarregue a página.</p>
                `;
            }
        });

        // =============================================
        // SALVAR
        // =============================================
        document.getElementById('formEditarPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnSalvar');
            const txtOriginal = btn.innerHTML;

            const nome  = document.getElementById('editNome').value.trim();
            const email = document.getElementById('editEmail').value.trim();

            if (!nome || nome.length < 3) {
                showToast('Nome é obrigatório (mín. 3 letras).', 'error');
                return;
            }
            if (email && !email.includes('@')) {
                showToast('E-mail inválido.', 'error');
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SALVANDO...';
            btn.disabled = true;

            const fd = new FormData();
            fd.append('id', document.getElementById('editId').value);
            fd.append('nome', nome);
            fd.append('email', email);
            fd.append('telefone', document.getElementById('editTelefone').value.trim());
            fd.append('endereco', document.getElementById('editEndereco').value.trim());
            fd.append('senha', document.getElementById('editSenha').value);

            try {
                const res = await fetch('../../PHP/Clientes/atualizar_perfil.php', {
                    method: 'POST',
                    body: fd,
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.status === 'sucesso') {
                    showToast(data.mensagem || 'Perfil atualizado!', 'success');
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showToast(data.mensagem || 'Erro ao salvar.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Erro de conexão.', 'error');
            } finally {
                btn.innerHTML = txtOriginal;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
