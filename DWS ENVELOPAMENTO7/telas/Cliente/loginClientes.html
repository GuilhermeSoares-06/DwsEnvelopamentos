<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DWS Envelopamento</title>
<link rel="icon" type="image/png" href="../../img/logoabas.png">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050505;
        background-image:
            radial-gradient(ellipse at top left, rgba(242, 53, 53, 0.12) 0%, transparent 50%),
            radial-gradient(ellipse at bottom right, rgba(242, 53, 53, 0.08) 0%, transparent 50%);
        background-attachment: fixed;
        margin: 0;
        padding: 30px 20px;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
    }

    /* GRID ANIMADO DE FUNDO */
    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(242, 53, 53, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(242, 53, 53, 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
        animation: gridMove 25s linear infinite;
    }

    @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 60px 60px; }
    }

    /* PARTÍCULAS FLUTUANTES */
    .particle {
        position: fixed;
        color: rgba(242, 53, 53, 0.06);
        font-size: 4rem;
        z-index: -1;
        pointer-events: none;
        animation: float 20s ease-in-out infinite;
    }
    .particle:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; font-size: 5rem; }
    .particle:nth-child(2) { top: 20%; right: 10%; animation-delay: -5s; font-size: 3rem; }
    .particle:nth-child(3) { bottom: 15%; left: 15%; animation-delay: -10s; font-size: 4rem; }
    .particle:nth-child(4) { bottom: 20%; right: 12%; animation-delay: -15s; font-size: 3.5rem; }

    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.05; }
        50% { transform: translateY(-30px) rotate(15deg); opacity: 0.12; }
    }

    /* CAIXA DE LOGIN */
    .login-box {
        position: relative;
        width: 460px;
        max-width: 100%;
        background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(10,10,10,0.98));
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 45px 40px 35px;
        margin: auto;
        animation: fadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* LED CONTORNADO GIRANDO */
    .login-box::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 30px;
        padding: 2px;
        background: linear-gradient(
            var(--angle, 0deg),
            transparent,
            #f23535,
            #ff6b6b,
            #f23535,
            transparent
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: ledRotate 4s linear infinite;
        pointer-events: none;
    }

    @keyframes ledRotate {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* BOTÃO VOLTAR */
    .btn-voltar {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #aaa;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
        padding: 8px 14px;
        border-radius: 10px;
        font-family: inherit;
        z-index: 2;
    }
    .btn-voltar:hover {
        color: #f23535;
        border-color: rgba(242, 53, 53, 0.4);
        background: rgba(242, 53, 53, 0.08);
        transform: translateX(-3px);
    }

    /* ÍCONE DE USUÁRIO */
    .login-logo-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin: 10px auto 22px;
    }

    .login-logo-wrap::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px dashed rgba(242, 53, 53, 0.3);
        animation: spinDashed 20s linear infinite;
    }

    @keyframes spinDashed {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .login-logo {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #f23535;
        box-shadow:
            0 0 0 5px rgba(242, 53, 53, 0.1),
            0 20px 40px rgba(242, 53, 53, 0.3);
        position: relative;
        z-index: 1;
        animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    /* HEADER */
    .login-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .login-header h2 {
        font-family: 'Orbitron', sans-serif;
        color: #fff;
        font-size: 1.6rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
    }

    .login-header h2 span {
        background: linear-gradient(135deg, #f23535, #ff6b6b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .login-header p {
        color: #888;
        font-size: 0.9rem;
    }

    /* AVISO DE RETORNO */
    .aviso-retorno {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(242, 53, 53, 0.08);
        border: 1px solid rgba(242, 53, 53, 0.25);
        color: #f23535;
        padding: 11px 15px;
        border-radius: 12px;
        font-size: 0.8rem;
        margin-bottom: 18px;
        text-align: left;
        line-height: 1.4;
        animation: fadeIn 0.5s ease;
    }
    .aviso-retorno i { flex-shrink: 0; }
    .aviso-retorno strong { color: #ff6b6b; }
    .aviso-retorno.hidden { display: none; }

    /* INPUTS */
    .input-box {
        position: relative;
        margin-bottom: 16px;
        width: 100%;
    }

    .input-box .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 0.95rem;
        transition: 0.3s;
        z-index: 1;
        pointer-events: none;
    }

    .input-box input {
        width: 100%;
        padding: 15px 16px 15px 46px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        outline: none;
        font-size: 0.95rem;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.02);
        color: #fff;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-family: inherit;
    }

    .input-box input::placeholder {
        color: #555;
        font-weight: 400;
    }

    .input-box input:focus {
        border-color: #f23535;
        background: rgba(242, 53, 53, 0.03);
        box-shadow: 0 0 0 4px rgba(242, 53, 53, 0.1);
    }

    .input-box input:focus ~ .input-icon {
        color: #f23535;
    }

    /* BOTÃO LOGIN */
    .btn-login {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 13px;
        background: linear-gradient(135deg, #f23535, #c91f2c);
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(242, 53, 53, 0.3);
    }

    .btn-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        transition: left 0.6s ease;
    }

    .btn-login:hover::before {
        left: 100%;
    }

    .btn-login:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 25px 55px rgba(242, 53, 53, 0.5);
    }

    .btn-login:disabled {
        opacity: 0.7;
        cursor: wait;
        transform: none;
    }

    /* FOOTER */
    .login-footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        text-align: center;
    }

    .cadastro-link {
        color: #888;
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .cadastro-link span {
        color: #f23535;
        font-weight: 700;
        transition: 0.3s;
    }

    .cadastro-link:hover {
        color: #fff;
    }

    .cadastro-link:hover span {
        color: #ff5555;
        text-decoration: underline;
    }

    /* RESPONSIVO */
    @media (max-height: 720px) {
        .login-logo-wrap, .login-logo { width: 85px; height: 85px; }
        .login-logo-wrap { margin-bottom: 16px; }
        .login-box { padding: 35px 32px 28px; }
        .login-header h2 { font-size: 1.35rem; }
        .input-box { margin-bottom: 12px; }
        .input-box input { padding: 13px 15px 13px 44px; }
    }

    @media (max-width: 480px) {
        html, body { padding: 20px 15px; }
        .login-box { padding: 35px 24px 28px; border-radius: 24px; }
        .login-logo-wrap, .login-logo { width: 85px; height: 85px; }
        .login-header h2 { font-size: 1.3rem; }
        .login-header p { font-size: 0.82rem; }
        .input-box input { padding: 13px 14px 13px 42px; font-size: 0.9rem; }
        .btn-login { font-size: 0.8rem; padding: 14px; }
        .cadastro-link { font-size: 0.85rem; }
        .btn-voltar { top: 15px; left: 15px; padding: 6px 10px; font-size: 0.75rem; }
    }
</style>
</head>

<body>

<!-- FUNDO -->
<div class="bg-grid"></div>
<i class="fas fa-user particle"></i>
<i class="fas fa-car particle"></i>
<i class="fas fa-motorcycle particle"></i>
<i class="fas fa-shield-halved particle"></i>

<div class="login-box">
    <button class="btn-voltar" onclick="history.back()" type="button">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>

    <div class="login-logo-wrap">
        <img src="../../img/icon.user2.png" alt="Ícone de usuário" class="login-logo">
    </div>

    <div class="login-header">
        <h2>Bem-vindo <span>de volta!</span></h2>
        <p>Faça login para continuar</p>
    </div>

    <div class="aviso-retorno hidden" id="avisoRetorno">
        <i class="fas fa-info-circle"></i>
        <span>Após o login, você voltará automaticamente para <strong id="avisoRetornoNome">a página anterior</strong>.</span>
    </div>

    <form action="../../PHP/Clientes/Logincliente.php" method="POST" autocomplete="off" id="formLogin">
        <input type="hidden" name="redirect" id="redirectInput" value="">

        <div class="input-box">
            <i class="fas fa-id-card input-icon"></i>
            <input type="text" name="cpf" id="cpfInput" placeholder="CPF (000.000.000-00)"
                   inputmode="numeric" maxlength="14" autocomplete="off" required>
        </div>

        <div class="input-box">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="senha" placeholder="Senha"
                   autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> ENTRAR
        </button>
    </form>

    <div class="login-footer">
        <a href="CadastroCliente.html" class="cadastro-link">
            Não tem conta? <span>Cadastre-se</span>
        </a>
    </div>
</div>

<script>
// Máscara CPF
document.getElementById('cpfInput').addEventListener('input', function (e) {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});

// Aviso de retorno
(function() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || '';
    const input = document.getElementById('redirectInput');
    const aviso = document.getElementById('avisoRetorno');
    const avisoNome = document.getElementById('avisoRetornoNome');

    if (redirect && input) {
        input.value = redirect;
        const nomesAmigaveis = {
            'contato.html': 'o agendamento',
            'servico.html': 'a página de serviços',
            'sobre.html': 'a página sobre nós',
            'principal.html': 'a página inicial',
            'meus_agendamentos.html': 'meus agendamentos',
            'editar_perfil.html': 'editar perfil'
        };
        if (aviso && avisoNome) {
            avisoNome.textContent = nomesAmigaveis[redirect] || 'a página anterior';
            aviso.classList.remove('hidden');
        }
    }
})();

// LED girando
const box = document.querySelector('.login-box');
let angle = 0;
function animar() {
    angle = (angle + 1.5) % 360;
    box.style.setProperty('--angle', angle + 'deg');
    requestAnimationFrame(animar);
}
animar();

// Submit — feedback visual
document.getElementById('formLogin').addEventListener('submit', function() {
    const btn = this.querySelector('.btn-login');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ENTRANDO...';
    btn.disabled = true;
});
</script>

<script src="../../js/page-transition.js"></script>
<script src="../../js/login-transition.js"></script>
</body>
</html>
