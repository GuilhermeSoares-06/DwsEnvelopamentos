<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Acesso Administrativo — DWS</title>
<link rel="icon" type="image/png" href="../../img/logoabas.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
    overflow-x: hidden;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    background: #050505;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
}

/* Scrollbar custom */
body::-webkit-scrollbar { width: 8px; }
body::-webkit-scrollbar-track { background: #0a0a0a; }
body::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #f23535, #c91f2c);
    border-radius: 10px;
}
body::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #ff6b6b, #f23535);
}

/* FUNDO ANIMADO */
.bg-animated {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(242, 53, 53, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(242, 53, 53, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #0a0a0a 0%, #000 100%);
}

.bg-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        linear-gradient(rgba(242, 53, 53, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 53, 53, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
    animation: gridMove 25s linear infinite;
}

@keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 60px 60px; }
}

.particle {
    position: fixed;
    color: rgba(242, 53, 53, 0.06);
    font-size: 4rem;
    z-index: -1;
    pointer-events: none;
    animation: float 20s ease-in-out infinite;
}
.particle:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; font-size: 5rem; }
.particle:nth-child(2) { top: 20%; right: 10%; animation-delay: -5s; font-size: 3rem; }
.particle:nth-child(3) { bottom: 15%; left: 15%; animation-delay: -10s; font-size: 4rem; }
.particle:nth-child(4) { bottom: 20%; right: 12%; animation-delay: -15s; font-size: 3.5rem; }

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.05; }
    50% { transform: translateY(-30px) rotate(15deg); opacity: 0.12; }
}

/* CAIXA DE LOGIN */
.login-box {
    position: relative;
    width: 460px;
    max-width: 100%;
    background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(10,10,10,0.98));
    border-radius: 30px;
    padding: 40px 40px 32px;
    backdrop-filter: blur(20px);
    animation: fadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    margin: auto;
}

/* LED CONTORNADO */
.login-box::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    padding: 2px;
    background: linear-gradient(
        var(--angle, 0deg),
        transparent,
        #f23535,
        #ff6b6b,
        #f23535,
        transparent
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: ledRotate 4s linear infinite;
    pointer-events: none;
}

@keyframes ledRotate {
    0% { --angle: 0deg; }
    100% { --angle: 360deg; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ÍCONE ADMIN */
.admin-icon {
    width: 85px;
    height: 85px;
    background: linear-gradient(135deg, #f23535, #c91f2c);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 2.6rem;
    color: #fff;
    box-shadow: 0 20px 50px rgba(242,53,53,0.4);
    transform: rotate(-5deg);
    position: relative;
    animation: floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(-5deg) translateY(-8px); }
}

/* TEXTOS */
.login-box h1 {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    font-size: 1.45rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: -0.5px;
}

.login-box .subtitle {
    color: #888;
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 14px;
}

.admin-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(242,53,53,0.1);
    color: #f23535;
    padding: 5px 16px;
    border-radius: 50px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid rgba(242,53,53,0.3);
    margin: 0 auto 22px;
    display: flex;
    justify-content: center;
    width: fit-content;
}

/* MENSAGEM DE ERRO */
.error-msg {
    background: rgba(242,53,53,0.1);
    color: #f23535;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid rgba(242,53,53,0.4);
    margin-bottom: 16px;
    font-size: 0.82rem;
    display: none;
    align-items: center;
    gap: 10px;
    font-weight: 500;
}

.error-msg.show {
    display: flex;
    animation: shake 0.5s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

/* INPUTS */
.input-box {
    position: relative;
    margin-bottom: 14px;
}

.input-box .input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
    font-size: 1rem;
    transition: 0.3s;
    pointer-events: none;
}

.input-box input {
    width: 100%;
    padding: 15px 18px 15px 50px;
    background: rgba(255,255,255,0.02);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    outline: none;
    transition: 0.3s;
}

.input-box input::placeholder {
    color: #555;
    font-weight: 400;
}

.input-box input:focus {
    border-color: #f23535;
    background: rgba(242,53,53,0.03);
    box-shadow: 0 0 0 4px rgba(242,53,53,0.1);
}

.input-box input:focus ~ .input-icon {
    color: #f23535;
}

/* BOTÃO */
.btn-login {
    width: 100%;
    padding: 15px;
    margin-top: 6px;
    background: linear-gradient(135deg, #f23535, #c91f2c);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 15px 40px rgba(242,53,53,0.3);
}

.btn-login::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.6s ease;
}

.btn-login:hover::before { left: 100%; }

.btn-login:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 25px 55px rgba(242,53,53,0.5);
}

.btn-login:disabled {
    opacity: 0.7;
    cursor: wait;
    transform: none;
}

/* LINKS */
.links-area {
    margin-top: 20px;
    text-align: center;
}

.divider {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 16px 0;
    color: #333;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242,53,53,0.2), transparent);
}

.link-cliente {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #aaa;
    text-decoration: none;
    font-size: 0.82rem;
    transition: 0.3s;
    padding: 10px 20px;
    border-radius: 12px;
}

.link-cliente:hover {
    color: #f23535;
    background: rgba(242,53,53,0.05);
}

.back-link {
    display: block;
    margin-top: 14px;
    color: #555;
    text-decoration: none;
    font-size: 0.78rem;
    transition: 0.3s;
}

.back-link:hover { color: #f23535; }

/* RESPONSIVO */
@media (max-height: 720px) {
    .admin-icon {
        width: 70px;
        height: 70px;
        font-size: 2.1rem;
        margin-bottom: 12px;
    }
    .login-box {
        padding: 30px 32px 26px;
    }
    .login-box h1 { font-size: 1.3rem; }
    .admin-badge { margin-bottom: 16px; }
    .input-box { margin-bottom: 12px; }
    .input-box input { padding: 13px 16px 13px 46px; }
    .btn-login { padding: 13px; }
    .links-area { margin-top: 14px; }
    .divider { margin: 12px 0; }
}

@media (max-width: 500px) {
    body { padding: 20px 15px; }
    .login-box { padding: 30px 24px 24px; border-radius: 24px; }
    .admin-icon { width: 70px; height: 70px; font-size: 2.1rem; margin-bottom: 14px; }
    .login-box h1 { font-size: 1.2rem; }
    .login-box .subtitle { font-size: 0.8rem; }
    .input-box input { padding: 13px 15px 13px 44px; font-size: 0.9rem; }
    .btn-login { padding: 13px; font-size: 0.82rem; }
}
</style>
</head>
<body>

<div class="bg-animated"></div>
<div class="bg-grid"></div>
<i class="fas fa-shield-halved particle"></i>
<i class="fas fa-lock particle"></i>
<i class="fas fa-user-shield particle"></i>
<i class="fas fa-crown particle"></i>

<div class="login-box">
    <div class="admin-icon">👑</div>

    <h1>Painel Admin</h1>
    <p class="subtitle">Acesso ao sistema DWS</p>
    <div class="admin-badge">
        <i class="fas fa-shield-alt"></i>
        ACESSO RESTRITO
    </div>

    <div id="errorMsg" class="error-msg">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText">Usuário ou senha incorretos.</span>
    </div>

    <form method="POST" action="../../PHP/ADM/LoginADM.php" id="loginForm" autocomplete="off">
        <div class="input-box">
            <i class="fas fa-user input-icon"></i>
            <input type="text" name="nome" id="nome" placeholder="USUÁRIO ADMIN" required autofocus autocomplete="off">
        </div>

        <div class="input-box">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="senha" id="senha" placeholder="SENHA" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
            <i class="fas fa-sign-in-alt"></i>
            ENTRAR
        </button>
    </form>

    <div class="links-area">
        <div class="divider">OU</div>
        <a href="../Cliente/loginClientes.html" class="link-cliente">
            <i class="fas fa-user"></i>
            Acessar como Cliente
        </a>
        <a href="../Cliente/principal.html" class="back-link">← Voltar ao site</a>
    </div>
</div>

<script>
// Força reload se vier do cache do "Voltar"
window.addEventListener('pageshow', function(e) {
    if (e.persisted) window.location.reload();
});

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const erro = params.get('erro');
    const saiu = params.get('saiu');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');

    if (saiu === '1') {
        errorText.textContent = 'Você saiu com sucesso!';
        errorMsg.classList.add('show');
        errorMsg.style.background = 'rgba(76,175,80,0.1)';
        errorMsg.style.color = '#4CAF50';
        errorMsg.style.borderColor = 'rgba(76,175,80,0.4)';
        const icone = errorMsg.querySelector('i');
        if (icone) icone.className = 'fas fa-check-circle';
    } else if (erro === 'restrito') {
        errorText.textContent = 'Você precisa fazer login para acessar o painel.';
        errorMsg.classList.add('show');
    } else if (erro === 'timeout') {
        errorText.textContent = 'Sessão expirada. Faça login novamente.';
        errorMsg.classList.add('show');
    } else if (erro === 'excluido') {
        errorText.textContent = 'Sua conta foi removida do sistema.';
        errorMsg.classList.add('show');
    } else if (erro === '1') {
        errorText.textContent = 'Usuário ou senha incorretos.';
        errorMsg.classList.add('show');
    } else if (erro === 'bloqueado') {
        errorText.textContent = 'Muitas tentativas. Aguarde 15 minutos.';
        errorMsg.classList.add('show');
    } else if (erro === '2') {
        errorText.textContent = 'Erro no sistema. Tente novamente.';
        errorMsg.classList.add('show');
    }

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnLogin');

    form.addEventListener('submit', function(e) {
        const nome = document.getElementById('nome').value.trim();
        const senha = document.getElementById('senha').value.trim();

        if (!nome || !senha) {
            e.preventDefault();
            errorText.textContent = 'Preencha todos os campos!';
            errorMsg.classList.add('show');
            return;
        }

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ENTRANDO...';
        btn.disabled = true;
    });

    // LED girando
    const box = document.querySelector('.login-box');
    let angle = 0;
    function animar() {
        angle = (angle + 1.5) % 360;
        box.style.setProperty('--angle', angle + 'deg');
        requestAnimationFrame(animar);
    }
    animar();
});
</script>

</body>
</html>
